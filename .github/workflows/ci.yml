# CI pipeline for the job tracker.
#
# Deliberately verbose comments: GitHub Actions is a named skills gap for the
# repo owner, so this file doubles as a worked example. Pipeline shape:
#
#   quality (lint -> typecheck -> unit tests) ──┐
#                                               ├─> smoke (Playwright) ─> image (GHCR, main only)
#                                               ┘
name: ci

# Run on every push to main and on every pull request targeting main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# If a new commit lands while a previous run is still going, cancel the old
# one — no point burning minutes on stale code.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- quality --
  quality:
    name: lint / typecheck / unit tests
    runs-on: ubuntu-latest
    steps:
      # Fetch the repository at the commit being tested.
      - uses: actions/checkout@v4

      # Install Node 22 (the version the Dockerfile ships) and enable the
      # built-in npm cache keyed on package-lock.json.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` = clean, reproducible install from the lockfile only.
      - run: npm ci

      # ESLint (Next.js flat config). Fails the job on errors, not warnings.
      - run: npm run lint

      # Full strict TypeScript pass over app + tests, no emit.
      - run: npm run typecheck

      # Vitest: date/derived-field logic, import duplicate detection, zod
      # schemas, repository + API route integration tests.
      - run: npm test

  # ------------------------------------------------------------------ smoke --
  smoke:
    name: playwright smoke
    runs-on: ubuntu-latest
    # Only bother booting the app if static checks and unit tests passed.
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Playwright needs its own browser binaries; --with-deps also installs
      # the OS packages Chromium requires on the Ubuntu runner.
      - run: npx playwright install --with-deps chromium

      # playwright.config.ts boots `next start` itself (webServer) against a
      # throwaway SQLite file, so a production build must exist first.
      - run: npm run build
      - run: npx playwright test

      # Keep traces/screenshots when the smoke test fails — invaluable for
      # debugging a failure you can't reproduce locally.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  # ------------------------------------------------------------------ image --
  image:
    name: build & push image (GHCR)
    runs-on: ubuntu-latest
    needs: [quality, smoke]
    # Push images only from main — PRs still validate the Dockerfile via the
    # build step, they just don't publish.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      # Needed to push to ghcr.io using the workflow's own GITHUB_TOKEN.
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Buildx enables layer caching between runs via the GitHub cache backend.
      - uses: docker/setup-buildx-action@v3

      # Log in to GitHub Container Registry with the ephemeral job token —
      # no personal access token to manage or rotate.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive tags: `latest` on main plus the commit SHA for traceability.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

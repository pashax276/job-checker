# Argo CD Application for GitOps deployment of the job tracker.
# Point repoURL at your fork, push, and `kubectl apply -f argocd/application.yaml`
# into the cluster running Argo CD (see repo README for the kind walkthrough).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: job-tracker
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # CHANGE ME: your Git remote for this repository
    repoURL: https://github.com/OWNER/job-checker.git
    targetRevision: main
    path: charts/job-tracker
    helm:
      valuesObject:
        image:
          # CHANGE ME: where CI pushes the image (GHCR on main)
          repository: ghcr.io/OWNER/job-checker
          tag: latest
        discovery:
          cronJob:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: job-tracker
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

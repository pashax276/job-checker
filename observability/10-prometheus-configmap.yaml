# Scrapes the tracker's /metrics directly — this is a single-service demo
# stack, not a cluster-wide Prometheus, so a static target beats standing up
# kubernetes_sd_config + RBAC for one endpoint. The target assumes the Helm
# release is named "job-tracker" (see argocd/application.yaml), which yields
# the Service name job-tracker-job-tracker.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: job-tracker
        static_configs:
          - targets: ["job-tracker-job-tracker.job-tracker.svc.cluster.local:3000"]
        metrics_path: /metrics

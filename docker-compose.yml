services:
  tracker:
    build: .
    ports: ["3000:3000"]
    volumes: ["tracker-data:/data"]
    environment:
      - DATABASE_PATH=/data/tracker.db
      # Uploaded resumes/cover letters live on the same volume as the DB
      - DOCUMENTS_DIR=/data/files
      # Discovery scheduler (in-process cron). 0 14 * * * UTC = 7:00 AM Pacific.
      - DISCOVERY_ENABLED=${DISCOVERY_ENABLED:-false}
      - DISCOVERY_CRON=${DISCOVERY_CRON:-0 14 * * *}
      # Optional basic auth (off unless both are set)
      - BASIC_AUTH_USER=${BASIC_AUTH_USER:-}
      - BASIC_AUTH_PASS=${BASIC_AUTH_PASS:-}
      # Optional AI features (fit summaries, prep questions, tailored drafts)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-}
    restart: unless-stopped

volumes:
  tracker-data:

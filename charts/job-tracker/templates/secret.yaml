{{- if and .Values.basicAuth.enabled (not .Values.basicAuth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "job-tracker.fullname" . }}-auth
  labels:
    {{- include "job-tracker.labels" . | nindent 4 }}
type: Opaque
stringData:
  BASIC_AUTH_USER: {{ required "basicAuth.username is required when basicAuth.enabled" .Values.basicAuth.username | quote }}
  BASIC_AUTH_PASS: {{ required "basicAuth.password is required when basicAuth.enabled" .Values.basicAuth.password | quote }}
{{- end }}

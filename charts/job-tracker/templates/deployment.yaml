apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "job-tracker.fullname" . }}
  labels:
    {{- include "job-tracker.labels" . | nindent 4 }}
spec:
  # SQLite on a PVC: strictly one replica, Recreate so old and new pods never
  # hold the database at the same time. See NOTES.txt.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "job-tracker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "job-tracker.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.metrics.scrapeAnnotations }}
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "3000"
        {{- end }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tracker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: {{ include "job-tracker.fullname" . }}
          {{- if .Values.basicAuth.enabled }}
          env:
            - name: BASIC_AUTH_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "job-tracker.secretName" . }}
                  key: BASIC_AUTH_USER
            - name: BASIC_AUTH_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "job-tracker.secretName" . }}
                  key: BASIC_AUTH_PASS
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "job-tracker.fullname" . }}-data
